# Alembic configuration. The DSN comes from PG_MIGRATION_DSN (direct to PostgreSQL, never pooled;
# migrations connect as lmqa_owner, a role no service holds - doc 10.3). No secrets in this file.
[alembic]
script_location = %(here)s/migrations
version_table_schema = alembic_meta

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
