[project]
name = "ingestion"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.162",
  "uvicorn>=0.54",
  "httpx>=0.28",
  "pydantic-settings>=2.16",
  "websockets>=15",
  "pypdf>=6.2",
  "pypdfium2>=5",
  "python-docx>=1.2",
  "lxml>=6",
  "fastembed>=0.7",
  "tokenizers>=0.22",
  "lmqa_models",
  "lmqa_auth",
  "lmqa_db",
  "lmqa_keys",
  "lmqa_security",
  "lmqa_audit",
  "lmqa_logging",
  "lmqa_vectorstore",
  "lmqa_objectstore"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.uv.sources]
lmqa_models = { workspace = true }
lmqa_auth = { workspace = true }
lmqa_db = { workspace = true }
lmqa_keys = { workspace = true }
lmqa_security = { workspace = true }
lmqa_audit = { workspace = true }
lmqa_logging = { workspace = true }
lmqa_vectorstore = { workspace = true }
lmqa_objectstore = { workspace = true }
