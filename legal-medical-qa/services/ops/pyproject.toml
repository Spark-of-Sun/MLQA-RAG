[project]
name = "ops"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.162",
  "uvicorn>=0.54",
  "httpx>=0.28",
  "pydantic-settings>=2.16",
  "websockets>=15",
  "lmqa_models",
  "lmqa_auth",
  "lmqa_db",
  "lmqa_keys",
  "lmqa_security",
  "lmqa_audit",
  "lmqa_logging"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops"]

[tool.uv.sources]
lmqa_models = { workspace = true }
lmqa_auth = { workspace = true }
lmqa_db = { workspace = true }
lmqa_keys = { workspace = true }
lmqa_security = { workspace = true }
lmqa_audit = { workspace = true }
lmqa_logging = { workspace = true }
