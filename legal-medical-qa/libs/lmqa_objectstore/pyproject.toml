[project]
name = "lmqa-objectstore"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "boto3>=1.43",
  "lmqa_keys"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmqa_objectstore"]

[tool.uv.sources]
lmqa_keys = { workspace = true }
