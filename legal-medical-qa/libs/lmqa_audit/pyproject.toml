[project]
name = "lmqa-audit"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "lmqa_db",
  "lmqa_security",
  "lmqa_keys"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmqa_audit"]

[tool.uv.sources]
lmqa_db = { workspace = true }
lmqa_security = { workspace = true }
lmqa_keys = { workspace = true }
