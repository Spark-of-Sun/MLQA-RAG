[project]
name = "lmqa-auth"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "pyjwt[crypto]>=2.15",
  "cryptography>=50",
  "httpx>=0.28",
  "valkey>=6.2",
  "fastapi>=0.162",
  "lmqa_models",
  "lmqa_db",
  "lmqa_keys"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmqa_auth"]

[tool.uv.sources]
lmqa_models = { workspace = true }
lmqa_db = { workspace = true }
lmqa_keys = { workspace = true }
