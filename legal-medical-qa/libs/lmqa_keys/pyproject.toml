[project]
name = "lmqa-keys"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "boto3>=1.43",
  "cryptography>=50",
  "httpx>=0.28",
  "lmqa_models"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmqa_keys"]

[tool.uv.sources]
lmqa_models = { workspace = true }
