[project]
name = "lmqa-testing"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "httpx>=0.28",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
  "lmqa_models",
  "lmqa_db"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmqa_testing"]

[tool.uv.sources]
lmqa_models = { workspace = true }
lmqa_db = { workspace = true }
