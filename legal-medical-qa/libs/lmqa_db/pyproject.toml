[project]
name = "lmqa-db"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "sqlalchemy[asyncio]>=2.1",
  "psycopg[binary]>=3.3",
  "lmqa_models"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmqa_db"]

[tool.uv.sources]
lmqa_models = { workspace = true }
