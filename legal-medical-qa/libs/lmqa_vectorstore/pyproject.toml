[project]
name = "lmqa-vectorstore"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "qdrant-client>=1.20",
  "lmqa_models"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmqa_vectorstore"]

[tool.uv.sources]
lmqa_models = { workspace = true }
