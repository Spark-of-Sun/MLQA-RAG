; TEST STACK ONLY (compose.test.yaml). Mirrors the PgBouncer the suite was run against: transaction pooling,
; prepared-statement support, trust auth for named users. Production uses pgbouncer.ini (SCRAM + auth_query).
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 5
max_prepared_statements = 100
auth_type = trust
auth_file = /etc/pgbouncer/userlist.test.txt
ignore_startup_parameters = extra_float_digits
admin_users = postgres
