[databases]
; every client connects as itself; PgBouncer authenticates it with the lookup function created by tools/db_migrate.py
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; transaction pooling: request-path services must not use session state (doc 10.3, G1.7)
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
; prepared statements are tracked by PgBouncer 1.21 or later
max_prepared_statements = 200
auth_type = scram-sha-256
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
ignore_startup_parameters = extra_float_digits
server_reset_query = DISCARD ALL
admin_users = pgbouncer_auth
log_connections = 0
log_disconnections = 0
