apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: lmqa
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: lmqa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lmqa
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: lmqa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: lmqa
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: frontend
      containers:
      - name: frontend
        image: REGISTRY/lmqa-ENV/frontend:TAG
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: lmqa-config
        - secretRef:
            name: lmqa-frontend
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lmqa
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: lmqa
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
  - name: http
    port: 3000
    targetPort: http
