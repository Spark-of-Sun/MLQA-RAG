apiVersion: v1
kind: ServiceAccount
metadata:
  name: citation-validator
  namespace: lmqa
  labels:
    app.kubernetes.io/name: citation-validator
    app.kubernetes.io/part-of: lmqa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: citation-validator
  namespace: lmqa
  labels:
    app.kubernetes.io/name: citation-validator
    app.kubernetes.io/part-of: lmqa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: citation-validator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: citation-validator
        app.kubernetes.io/part-of: lmqa
    spec:
      serviceAccountName: citation-validator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: citation-validator
      containers:
      - name: citation-validator
        image: REGISTRY/lmqa-ENV/citation-validator:TAG
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8004
          name: http
        envFrom:
        - configMapRef:
            name: lmqa-config
        - secretRef:
            name: lmqa-citation-validator
        readinessProbe:
          httpGet:
            path: /internal/v1/health
            port: http
          periodSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /internal/v1/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: citation-validator
  namespace: lmqa
  labels:
    app.kubernetes.io/name: citation-validator
    app.kubernetes.io/part-of: lmqa
spec:
  selector:
    app.kubernetes.io/name: citation-validator
  ports:
  - name: http
    port: 8004
    targetPort: http
