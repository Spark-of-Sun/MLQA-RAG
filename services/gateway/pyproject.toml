[project]
name = "legalmed-gateway"
version = "0.1.0"
description = "GatewayAPI — auth, rate limiting, request validation, routing; only service the frontend calls"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pyjwt>=2.8",
    "structlog>=24.1",
    "legalmed-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.middleware", "app.auth", "app.schemas"]
package-dir = {"app" = "app"}

[tool.pytest.ini_options]
asyncio_mode = "strict"
