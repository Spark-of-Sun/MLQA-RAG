[project]
name = "gateway"
version = "0.1.0"
description = "Gateway: token verification, principal resolution, route allow-list, gated query release."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.34",
    "lmqa-models", "lmqa-db", "lmqa-audit", "lmqa-auth",
    "identity", "ingestion", "retrieval", "generation", "citation-validator", "audit",
    "lmqa-keys", "valkey>=6.2",
]

[tool.uv.sources]
lmqa-keys = { workspace = true }
lmqa-models = { workspace = true }
lmqa-db = { workspace = true }
lmqa-audit = { workspace = true }
lmqa-auth = { workspace = true }
identity = { workspace = true }
ingestion = { workspace = true }
retrieval = { workspace = true }
generation = { workspace = true }
citation-validator = { workspace = true }
audit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
