[project]
name = "legalmed-citation-validator"
version = "0.1.0"
description = "Citation Validator — deterministic, non-LLM gate on every generated answer's citations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "structlog>=24.1",
    "legalmed-common",
]

[project.optional-dependencies]
# Real entailment backend — a cross-encoder NLI model. Requires torch.
# Not required for local unit tests; app/entailment_check/fake_backend.py
# (deterministic word-overlap scoring) covers all of this service's tests.
real = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.parser", "app.entailment_check", "app.schemas"]
package-dir = {"app" = "app"}

[tool.pytest.ini_options]
asyncio_mode = "strict"
