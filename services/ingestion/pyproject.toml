[project]
name = "legalmed-ingestion"
version = "0.1.0"
description = "Ingestion service — upload intake, OCR, structure-aware chunking, embedding; async background jobs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "arq>=0.26",
    "boto3>=1.34",
    "qdrant-client>=1.9",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "structlog>=24.1",
    "legalmed-common",
]

[project.optional-dependencies]
# Heavy/real backends — require system packages (tesseract-ocr, poppler-utils)
# and a torch install. Installed in the Docker image (see Dockerfile); NOT
# required for local unit tests, which use the fake backends in
# app/ocr/fake_backend.py and app/embedding/fake_backend.py.
real = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.ocr", "app.chunking", "app.embedding", "app.workers", "app.schemas"]
package-dir = {"app" = "app"}

[tool.pytest.ini_options]
asyncio_mode = "strict"
