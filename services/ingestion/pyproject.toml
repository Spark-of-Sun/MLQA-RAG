[project]
name = "ingestion"
version = "0.1.0"
description = "Ingestion service: upload, parse, structure-aware chunking, embedding, indexing (blueprint 11.1)."
requires-python = ">=3.14"
dependencies = [
    "lmqa-models", "lmqa-db", "lmqa-audit", "lmqa-objectstore", "lmqa-vectorstore",
    "pypdf>=7.1", "fonttools>=4.68", "python-docx>=1.2", "defusedxml>=0.7.1",
]

[tool.uv.sources]
lmqa-models = { workspace = true }
lmqa-db = { workspace = true }
lmqa-audit = { workspace = true }
lmqa-objectstore = { workspace = true }
lmqa-vectorstore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
