[project]
name = "legalmed-retrieval"
version = "0.1.0"
description = "Retrieval service — hybrid search, metadata filtering, cross-encoder re-ranking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qdrant-client>=1.9",
    "rank-bm25>=0.2.2",
    "pydantic>=2.6",
    "structlog>=24.1",
    "legalmed-common",
]

[project.optional-dependencies]
# Real cross-encoder re-ranker — requires torch/sentence-transformers.
# Not required for local unit tests (app/reranker/fake_backend.py covers those).
real = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.hybrid_search", "app.reranker", "app.filters", "app.schemas"]
package-dir = {"app" = "app"}

[tool.pytest.ini_options]
asyncio_mode = "strict"
