; PgBouncer for the request path (blueprint 4.5, 4.8, G0.13, G1.7).
; Transaction pooling: a server connection is held only for one transaction, so request code must keep all context
; transaction-local (set_config(..., true)); `lmqa_db.Database.scoped()` does. Workers that LISTEN/NOTIFY or take
; session advisory locks, and migrations, connect to PostgreSQL directly, never through this pooler.
; Credentials: data/infra/pgbouncer/userlist.txt holds the SCRAM verifiers copied from pg_authid by `make migrate`,
; so PgBouncer authenticates clients with SCRAM and passes the client's SCRAM keys through to PostgreSQL.

[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; Protocol-level prepared statements across pooled server connections (PgBouncer 1.21+); psycopg prepares
; statements after a few executions, so this must stay above zero.
max_prepared_statements = 200
max_client_conn = 400
default_pool_size = 20
min_pool_size = 0
reserve_pool_size = 5
server_reset_query =
server_reset_query_always = 0
server_check_query = select 1
ignore_startup_parameters = extra_float_digits,options
admin_users =
stats_users =
log_connections = 0
log_disconnections = 0
