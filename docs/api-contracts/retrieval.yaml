openapi: 3.0.3
info:
  title: Legal/Medical QA — Retrieval API
  version: 0.1.0
  description: >
    Internal service, called only by the Gateway. Owns hybrid search,
    metadata filtering, and cross-encoder re-ranking. Does not do prompt
    assembly or LLM calls.
servers:
  - url: http://localhost:8002
    description: local

security:
  - serviceAuth: []

paths:
  /healthz:
    get:
      summary: Liveness/readiness probe
      security: []
      responses:
        "200":
          description: OK

  /internal/v1/search:
    post:
      summary: Hybrid search + metadata filter + re-rank, return the trimmed chunk set
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Re-ranked, access-filtered chunk set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "403":
          description: Requested scope exceeds the caller's access grant

components:
  securitySchemes:
    serviceAuth:
      type: apiKey
      in: header
      name: X-Internal-Service-Key
      description: Shared internal API key locally; mTLS/signed service tokens in production

  schemas:
    SearchRequest:
      type: object
      required: [query, tenant_id, matter_or_patient_id]
      properties:
        query:
          type: string
        tenant_id:
          type: string
        matter_or_patient_id:
          type: string
        confidentiality_tiers_allowed:
          type: array
          items:
            type: string
            enum: [standard, privileged, phi]
        top_k_dense:
          type: integer
          default: 40
        top_k_sparse:
          type: integer
          default: 40
        rerank_top_k:
          type: integer
          default: 8

    SearchResponse:
      type: object
      properties:
        query:
          type: string
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/RankedChunk"
        dropped_chunk_count:
          type: integer
          description: Candidates that failed the metadata/access filter, not surfaced to generation

    RankedChunk:
      type: object
      properties:
        chunk_id:
          type: string
        document_id:
          type: string
        text:
          type: string
        page:
          type: integer
        section:
          type: string
        confidentiality_tier:
          type: string
          enum: [standard, privileged, phi]
        matter_or_patient_id:
          type: string
        effective_date:
          type: string
          format: date
        dense_score:
          type: number
        sparse_score:
          type: number
        rerank_score:
          type: number

