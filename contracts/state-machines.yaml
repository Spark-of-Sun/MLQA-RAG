# Lifecycle state machines (blueprint 6), MVP subset. The identity service reads transitions from this file;
# any pair not listed is illegal and answers 409.
version: 1
machines:
  admin_membership:
    states: [pending, active, rejected, suspended]
    transitions:
      # action:   from      -> to         and the admin's workspace moves to
      approve:    { from: pending,   to: active,    workspace: active }
      reject:     { from: pending,   to: rejected,  workspace: rejected }
      suspend:    { from: active,    to: suspended, workspace: frozen }
      reactivate: { from: suspended, to: active,    workspace: active }
  tenant_membership:
    states: [pending, active, rejected, suspended]
    transitions:
      approve:    { from: pending,   to: active }
      reject:     { from: pending,   to: rejected }
      suspend:    { from: active,    to: suspended }
      reactivate: { from: suspended, to: active }
  document:
    states: [processing, ready, failed]
    transitions:
      indexed:    { from: processing, to: ready }
      failed:     { from: processing, to: failed }
