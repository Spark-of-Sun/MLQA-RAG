[project]
name = "lmqa-testing"
version = "0.1.0"
description = "Real-data test support (blueprint 18, 19.1): infrastructure probes, corpus access, leak scanning. No mocks."
requires-python = ">=3.14"
dependencies = ["lmqa-models", "lmqa-db", "httpx>=0.28", "hypothesis>=6.170.17", "boto3>=1.44", "valkey>=6.2"]

[tool.uv.sources]
lmqa-models = { workspace = true }
lmqa-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
