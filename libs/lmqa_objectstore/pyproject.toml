[project]
name = "lmqa-objectstore"
version = "0.1.0"
description = "Original-file storage. Local filesystem in the MVP; the S3 adapter is a later stage."
requires-python = ">=3.14"
dependencies = ["lmqa-keys", "boto3>=1.44"]

[tool.uv.sources]
lmqa-keys = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
