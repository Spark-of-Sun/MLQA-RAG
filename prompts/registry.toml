# Prompt registry (blueprint 11.5, 11.7). The generation service loads these files and records the SHA-256 of
# the assembled prompt set with every query and in its audit event.
[answer]
version = 2
system = "templates/answer.md"
few_shot = "few_shot_examples/answer.md"

[verify]
version = 1
system = "templates/verify.md"

[condense]
version = 1
system = "templates/condense.md"
