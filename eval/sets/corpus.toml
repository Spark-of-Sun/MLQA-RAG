# Retrieval evaluation set over the public corpus (corpus/manifest.toml; fetch with `make corpus`).
#
# Each case names the passage(s) that answer it: a passage counts as relevant when it belongs to `file` and its text
# contains `contains` (case and whitespace are ignored), so labels survive changes to chunk boundaries. A case with
# `answerable = false` has no answer anywhere in the corpus and checks that retrieval keeps nothing (abstention).
#
# Provenance (blueprint 19, R10): drafted from the documents' own text; every label quotes the source. These labels
# still need review by a qualified person before they can set release floors (eval/floors.toml marks them baseline).
# Questions are deliberately worded differently from the documents where a real user would do so.

# ---------------------------------------------------------------- Separation and Release Agreement (EDGAR EX-10.2)
[[case]]
id = "sep-payment-deadline"
question = "When must the severance benefit be paid?"
expect = [{ file = "edgar-0001104659-24-041548-tm2410073d11_ex10-2.htm", contains = "shall be paid no later than thirty (30) days following the Separation Date" }]

[[case]]
id = "sep-release-window"
question = "How long does the executive have to sign the general release?"
expect = [{ file = "edgar-0001104659-24-041548-tm2410073d11_ex10-2.htm", contains = "within forty-five (45) days" }]

[[case]]
id = "sep-governing-law"
question = "Which state's law governs the separation agreement?"
expect = [{ file = "edgar-0001104659-24-041548-tm2410073d11_ex10-2.htm", contains = "laws of the Commonwealth of Virginia" }]

[[case]]
id = "sep-employment-agreement-end"
question = "What happens to the executive's employment agreement when he leaves?"
expect = [{ file = "edgar-0001104659-24-041548-tm2410073d11_ex10-2.htm", contains = "the Employment Agreement shall terminate on the Separation Date" }]

[[case]]
id = "sep-280g"
question = "Does the Section 280G limitation of benefits still apply?"
expect = [{ file = "edgar-0001104659-24-041548-tm2410073d11_ex10-2.htm", contains = "5. Section 280G" }]

