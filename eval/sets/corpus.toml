# ---------------------------------------------------------------- 45 CFR Part 164 (eCFR)
[[case]]
id = "hipaa-ba-breach-deadline"
question = "How quickly must a business associate report a breach to the covered entity?"
expect = [{ file = "ecfr-45-cfr-164.xml", contains = "no case later than 60 calendar days after discovery of a breach" }]

[[case]]
id = "hipaa-media-500"
question = "When does a covered entity have to notify the media about a breach?"
expect = [{ file = "ecfr-45-cfr-164.xml", contains = "more than 500 residents of a State or jurisdiction" }]

[[case]]
id = "hipaa-auto-logoff"
question = "Is automatic logoff required under the technical safeguards in 164.312?"
expect = [{ file = "ecfr-45-cfr-164.xml", contains = "Automatic logoff (Addressable)" }]

[[case]]
id = "hipaa-retention"
question = "How long must documentation required by 164.105 be kept?"
expect = [{ file = "ecfr-45-cfr-164.xml", contains = "6 years from the date of its creation or the date when it last was in effect" }]

[[case]]
id = "hipaa-minimum-necessary"
question = "What is the minimum necessary standard for using protected health information?"
expect = [{ file = "ecfr-45-cfr-164.xml", contains = "Minimum necessary applies" }]

# ---------------------------------------------------------------- Trump v. United States, No. 23-939 (SCOTUS)
[[case]]
id = "scotus-disposition"
question = "What did the Supreme Court do with the D.C. Circuit's judgment in 23-939?"
expect = [{ file = "scotus-23-939.pdf", contains = "vacated and remanded" }]

[[case]]
id = "scotus-author"
question = "Who wrote the majority opinion in Trump v. United States?"
expect = [{ file = "scotus-23-939.pdf", contains = "delivered the opinion of the Court" }]

[[case]]
id = "scotus-lower-courts"
question = "How did the lower courts rule on the former President's motion to dismiss for immunity?"
expect = [{ file = "scotus-23-939.pdf", contains = "former Presi- dents do not possess federal criminal immunity" }]

# ---------------------------------------------------------------- Metoprolol tartrate label (DailyMed)
[[case]]
id = "meto-htn-start"
