name: Stage Gates

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage level to evaluate (default: 1)'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  gatekeeper:
    name: Evaluate Stage Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.27.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Start container dependencies
        run: |
          docker compose up -d
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U lmqa_app -d lmqa >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Install uv
        uses: astral-sh/setup-uv@80fbe0140ccf08d50eff5eeb98dff9021c415a21 # v5.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Setup environment configuration
        run: cp .env.example .env

      - name: Apply database migrations
        run: uv run python -m tools.migrate.main

      - name: Evaluate Stage 0 Gates
        run: uv run python -m tools.gatekeeper.main --stage 0 --profile mvp-a

      - name: Evaluate Stage 1 Gates
        run: uv run python -m tools.gatekeeper.main --stage ${{ github.event.inputs.stage || '1' }} --profile mvp-a
