# The cumulative gate (R-93 criteria 1, 2 and 5; blueprint 19.6). Every pull request re-runs stages 0..STAGE through
# `make gate`, which writes gates/stage-N.json. CI then signs that attestation with cosign keyless signing and
# publishes a GitHub artifact attestation for the commit. The gate steps themselves live in stages.toml.
name: gates

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to gate (empty = the STAGE file)"
        required: false
        default: ""
      profile:
        description: "Gate profile (full is the only profile valid for production)"
        type: choice
        options: [full, mvp]
        default: full

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Live-lane credentials (Auth0 test tenant, AWS KMS, LLM key) are scoped to this environment.
    environment: live
    permissions:
      contents: read
      id-token: write # cosign keyless signing, artifact attestations and AWS OIDC
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install gitleaks (checksum-verified release binary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks --dir "$dir" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$dir"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: vars.AWS_LIVE_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_LIVE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: make install
      - name: Generate throwaway local secrets for the runner's stack
        run: uv run --frozen python tools/gen_env.py
      - run: make up
      - name: make gate
        id: gate
        env:
          STAGE: ${{ inputs.stage }}
          PROFILE: ${{ inputs.profile }}
          KMS_PROVIDER: ${{ vars.KMS_PROVIDER }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          LLM_TEST_BUDGET_USD: ${{ vars.LLM_TEST_BUDGET_USD }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE_MAIN: ${{ secrets.AUTH0_AUDIENCE_MAIN }}
          AUTH0_CLIENT_ID_BFF: ${{ secrets.AUTH0_CLIENT_ID_BFF }}
          AUTH0_CLIENT_SECRET_BFF: ${{ secrets.AUTH0_CLIENT_SECRET_BFF }}
          AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_M2M_CLIENT_ID }}
          AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_M2M_CLIENT_SECRET }}
          AUTH0_CLIENT_ID_HARNESS: ${{ secrets.AUTH0_CLIENT_ID_HARNESS }}
          AUTH0_CLIENT_SECRET_HARNESS: ${{ secrets.AUTH0_CLIENT_SECRET_HARNESS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: make gate
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: always() && hashFiles('gates/stage-*.json') != ''
      - name: Sign the attestation (cosign keyless)
        # The attestation records its own verdict, so a failing gate is signed too. Fork pull requests get no
        # OIDC token and stay unsigned, which the gatekeeper treats as a local run.
        if: >-
          always() && hashFiles('gates/stage-*.json') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          for f in gates/stage-*.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Publish a GitHub artifact attestation for this commit
        if: >-
          always() && hashFiles('gates/stage-*.json') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: gates/stage-*.json
      - name: Upload the attestation, signature bundle, JUnit and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ github.sha }}
          path: gates/
          if-no-files-found: warn
      - name: Stop the stack
        if: always()
        run: make down
