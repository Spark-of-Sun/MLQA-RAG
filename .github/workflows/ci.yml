name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Sanity-checks libs/common and libs/prompt_registry_client in isolation,
  # before any service job runs — if the shared contracts are broken,
  # every service job would fail for the same root cause, so fail fast here.
  libs-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared libs
        run: |
          pip install -e libs/common
          pip install -e libs/prompt_registry_client
      - name: Run libs smoke test
        env:
          APP_SECRET_KEY: ci-test-secret-value-32-bytes-long
          FIELD_ENCRYPTION_KEY: ci-test-encryption-key
          INTERNAL_SERVICE_API_KEY: ci-test-internal-key
          JWT_ISSUER: legalmed-ci
          JWT_AUDIENCE: legalmed-services
        run: |
          mkdir -p prompts/templates
          python check_libs.py

  # One job per service — each gets its own fresh runner, so there is no
  # risk of one service's "app" package colliding with another's (the
  # exact collision we hit locally when installing two services into the
  # same venv). This mirrors what separate Docker containers give in
  # production: isolated filesystems, isolated installed packages.
  test:
    needs: libs-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, ingestion, retrieval, generation, citation_validator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shared libs
        run: |
          pip install -e libs/common
          pip install -e libs/prompt_registry_client

      - name: Install ${{ matrix.service }} (fake backends only, no [real] extra)
        run: pip install -e services/${{ matrix.service }}

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio

      - name: Run ${{ matrix.service }} unit tests
        working-directory: services/${{ matrix.service }}
        env:
          ENVIRONMENT: local
        run: pytest -v

  lint:
    needs: libs-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, ingestion, retrieval, generation, citation_validator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shared libs
        run: |
          pip install -e libs/common
          pip install -e libs/prompt_registry_client

      - name: Install ${{ matrix.service }}
        run: pip install -e services/${{ matrix.service }}

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Ruff
        working-directory: services/${{ matrix.service }}
        run: ruff check .

      - name: Mypy
        working-directory: services/${{ matrix.service }}
        run: mypy app
        # TODO: remove once full type coverage is in place across all five
        # services — right now this reports issues without blocking CI.
        continue-on-error: true
