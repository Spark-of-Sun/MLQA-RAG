name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@80fbe0140ccf08d50eff5eeb98dff9021c415a21 # v5.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check code formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint code (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Check import boundaries
        run: uv run lint-imports

      - name: Verify path ownership
        run: uv run python -m tools.ownership_check --check-all

      - name: Run stage0 tests
        run: uv run pytest -m "stage0"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.1.0
        with:
          node-version: 24

      - name: Run frontend check
        run: |
          cd frontend
          npm run lint
