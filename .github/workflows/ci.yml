name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    env:
      PG_HOST: localhost
      PG_PORT: 6432
      PG_USER: lmqa_app
      PG_DATABASE: lmqa
      QDRANT_URL: http://localhost:6333
      VALKEY_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.27.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Start container dependencies
        run: |
          docker compose up -d
          # Wait for PostgreSQL and Qdrant readiness
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U lmqa_app -d lmqa >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Install uv
        uses: astral-sh/setup-uv@80fbe0140ccf08d50eff5eeb98dff9021c415a21 # v5.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Apply database migrations
        run: uv run python -m tools.migrate.main

      - name: Run environment doctor
        run: uv run python -m tools.doctor.main

      - name: Check code formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint code (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Check import boundaries
        run: uv run lint-imports

      - name: Verify path ownership
        run: uv run python -m tools.ownership_check --check-all

      - name: Run test suite
        run: uv run pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Run frontend check
        run: |
          cd frontend
          npm run lint
