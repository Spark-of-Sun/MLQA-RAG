name: Multi-Tenant Isolation Suite

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation-suite:
    name: Verify Multi-Tenant Isolation
    runs-on: ubuntu-latest
    env:
      PG_HOST: localhost
      PG_PORT: 6432
      PG_USER: lmqa_admin
      PG_PASSWORD: lmqa_secret
      PG_DATABASE: lmqa
      QDRANT_URL: http://localhost:6333
      VALKEY_URL: redis://:password@localhost:6379/0
      VALKEY_PASSWORD: password
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start container dependencies
        run: |
          docker compose up -d
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U lmqa_admin -d lmqa >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Install uv
        uses: astral-sh/setup-uv@80fbe0140ccf08d50eff5eeb98dff9021c415a21 # v5.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Apply database migrations
        run: uv run python -m tools.migrate.main

      - name: Run isolation suite
        run: make isolation
