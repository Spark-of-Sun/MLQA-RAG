# uv workspace root (blueprint 18): one lockfile, src/ layout per package, shared ruff config.
[project]
name = "legal-medical-qa"
version = "0.1.0"
description = "Cited, verified question answering over legal and medical documents (MVP)."
requires-python = ">=3.14"
dependencies = ["gateway"]

[dependency-groups]
dev = ["ruff>=0.17"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
gateway = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "TID"]
ignore = ["S101", "S311", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "No mocks (blueprint 19.1): verify against real PostgreSQL, real documents and real Gemini."

[tool.ruff.lint.isort]
known-first-party = [
    "lmqa_models", "lmqa_db", "lmqa_audit", "lmqa_auth", "lmqa_security", "lmqa_vectorstore", "lmqa_objectstore",
    "gateway", "identity", "ingestion", "retrieval", "generation", "citation_validator", "audit",
]
