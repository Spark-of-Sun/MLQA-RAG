# Local infrastructure for the MVP: PostgreSQL 18 with pgvector (documents, vectors, RLS, audit).
# Bound to 127.0.0.1 only. Started by `make db`, which exports the generated password first.
name: lmqa

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: lmqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${LMQA_DB_SUPERUSER_PASSWORD:?run make setup first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${LMQA_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=60"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
