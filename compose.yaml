services:
  postgres:
    image: postgres:18.0-alpine@sha256:d9426f8ea9db278ffbc4b5b5c907a4a9a0ea6fbc6256f1846b4122e2a222383c
    environment:
      POSTGRES_DB: lmqa
      POSTGRES_USER: ${PG_USER:-lmqa_admin}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-lmqa_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-lmqa_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1@sha256:8b472e3a1f9a2e3199c0b115456cbbcfef6b940a44f9c0667e651bc724c96ad6
    environment:
      DB_USER: ${PG_USER:-lmqa_admin}
      DB_PASSWORD: ${PG_PASSWORD:-lmqa_secret}
      DB_HOST: postgres
      DB_NAME: lmqa
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9.1.0-alpine@sha256:e0498b58a14ec13e9a5d3148ca5439cefa5c276b6d51c723f95b58ca4ce9450a
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-password}"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $${VALKEY_PASSWORD:-password} ping 2>/dev/null || valkey-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:1f185ef345091a13e8d2e8b0e774591a26b2aa61a0b5cbe83995f5dfd2d79d95
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  openbao:
    image: openbao/openbao:2.1.0@sha256:c18b76df47e85c1387d8537b01851e44f7ba9c71ea00d80cbece2cbdf8f3e5b3
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:-root}
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "bao status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest@sha256:0d6945a0b73c2a1188cf864388e2c0e819e917d2948bbca9574cf30e55724219
    healthcheck:
      test: ["CMD-SHELL", "clamdscan /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  qdrant_data:
