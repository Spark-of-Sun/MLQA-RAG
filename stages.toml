# stages.toml — path-to-stage ownership map and gate profiles

[profiles]
names = ["mvp-a", "mvp", "full"]
default = "mvp-a"

[profile.mvp-a]
description = "M1a first cut: legal documents only, S3 object store, reduced corpus and queries"
required_gates = [
    "G0.1", "G0.2", "G0.3", "G0.4", "G0.5", "G0.6", "G0.7", "G0.8", "G0.9", "G0.10", "G0.11", "G0.12", "G0.13",
    "G1.1", "G1.2", "G1.3", "G1.4", "G1.5", "G1.6", "G1.7", "G1.8", "G1.9", "G1.10", "G1.11", "G1.12",
    "G2.1", "G2.2", "G2.3", "G2.4", "G2.5", "G2.6", "G2.7", "G2.8",
    "G3.1", "G3.2", "G3.3", "G3.4", "G3.5", "G3.6", "G3.7",
    "G4.1", "G4.2", "G4.3", "G4.4", "G4.7", "G4.8",
    "G5.1", "G5.2", "G5.3", "G5.4", "G5.5", "G5.6", "G5.7", "G5.8",
    "G6.1", "G6.2", "G6.3", "G6.4", "G6.5", "G6.6",
    "G7.1", "G7.2", "G7.3", "G7.4", "G7.5", "G7.6", "G7.7", "G7.8",
    "G8.1", "G8.2", "G8.4", "G8.5", "G8.6",
    "G9.1", "G9.2", "G9.3", "G9.4", "G9.5", "G9.6",
    "MG1", "MG2", "MG3", "MG5", "MG6",
]
disabled_gates = [
    "G4.5", "G4.6", "G8.3",
]

[profile.mvp-a.sizes]
legal_documents_min = 25
medical_documents_min = 0
scanned_pdf_min = 0
long_documents_100p_min = 3
questions = 50
questions_answerable = 40
questions_unanswerable = 10
live_queries = 100
labeled_calibration_pairs = 100
critical_alerts = 3
acceptance_runs = 1

[profile.mvp]
description = "M1 MVP release: legal and medical documents, 320 live queries, 3 acceptance runs"
required_gates = [
    "G0.1", "G0.2", "G0.3", "G0.4", "G0.5", "G0.6", "G0.7", "G0.8", "G0.9", "G0.10", "G0.11", "G0.12", "G0.13",
    "G1.1", "G1.2", "G1.3", "G1.4", "G1.5", "G1.6", "G1.7", "G1.8", "G1.9", "G1.10", "G1.11", "G1.12",
    "G2.1", "G2.2", "G2.3", "G2.4", "G2.5", "G2.6", "G2.7", "G2.8",
    "G3.1", "G3.2", "G3.3", "G3.4", "G3.5", "G3.6", "G3.7",
    "G4.1", "G4.2", "G4.3", "G4.4", "G4.5", "G4.6", "G4.7", "G4.8",
    "G5.1", "G5.2", "G5.3", "G5.4", "G5.5", "G5.6", "G5.7", "G5.8",
    "G6.1", "G6.2", "G6.3", "G6.4", "G6.5", "G6.6",
    "G7.1", "G7.2", "G7.3", "G7.4", "G7.5", "G7.6", "G7.7", "G7.8",
    "G8.1", "G8.2", "G8.3", "G8.4", "G8.5", "G8.6",
    "G9.1", "G9.2", "G9.3", "G9.4", "G9.5", "G9.6",
    "MG1", "MG2", "MG3", "MG4", "MG5", "MG6",
]
disabled_gates = []

[profile.mvp.sizes]
legal_documents_min = 60
medical_documents_min = 60
scanned_pdf_min = 10
long_documents_100p_min = 3
questions = 160
live_queries = 320
labeled_calibration_pairs = 200
critical_alerts = 5
acceptance_runs = 3

[profile.full]
description = "Full production profile: all gates, maximum thresholds"

